name: Windows WebView2 host

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-webview-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-webview:
    name: Windows production WebView2 and rendered capture
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Read the exact locked WASM compiler version
        id: wasm-tool
        shell: python
        run: |
          import os
          import tomllib

          with open("Cargo.lock", "rb") as source:
              versions = [p["version"] for p in tomllib.load(source)["package"]
                          if p["name"] == "wasm-bindgen"]
          if len(versions) != 1:
              raise RuntimeError("the canonical lock must select one WASM compiler")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={versions[0]}\n")
      - name: Install the isolated test runner and lock-matched WASM compiler
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: |
            cargo-nextest@0.9.143
            wasm-bindgen@${{ steps.wasm-tool.outputs.version }}
          checksum: true
      # Check the normal library before tests can activate dev-dependencies.
      - name: Check production Windows WebView2 without dev-dependencies
        run: cargo check --locked -p moirai-pal --lib --no-default-features --features webview2
      - name: Lint every Windows PAL target
        run: cargo clippy --locked -p moirai-pal --all-targets --no-default-features --features webview2 -- -D warnings
      - name: Run WebView2 policy and complete frame validation
        run: >-
          cargo nextest run --locked -p moirai-pal --lib
          --no-default-features --features webview2
          --config-file .config/nextest.toml --test-threads 1 --retries 0
          --no-tests fail --no-fail-fast -E 'test(windows::webview::) | test(windows::window::tests::destruction::) | test(webview_startup::late_input::) | test(webview_startup::config::late_input_tests::)'
      # Each nextest process owns its COM apartment and native message pump.
      # The two stress tests retain their real 100-host concurrent scenarios;
      # nextest runs those scenarios sequentially with a 60-second test limit.
      - name: Capture real rendered surfaces with the installed WebView2 runtime
        run: |
          $previewTests = @(
            'windows::webview::tests::preview::installed_runtime_captures_rendered_preview',
            'windows::webview::tests::preview::installed_runtime_refuses_capture_while_hidden',
            'windows::webview::tests::preview::installed_runtime_captures_immediately_after_reshow_concurrently',
            'windows::webview::tests::preview::installed_runtime_captures_after_settled_navigation_and_reshow_concurrently'
            'windows::webview::tests::permissions::installed_runtime_denies_each_repeated_permission_without_saved_decisions'
          )
          foreach ($previewTest in $previewTests) {
            cargo nextest run --locked -p moirai-pal --lib --no-default-features --features webview2 --config-file .config/nextest.toml --test-threads 1 --retries 0 --run-ignored only --no-tests fail -E "test(=$previewTest)"
            if ($LASTEXITCODE -ne 0) {
              throw "Installed-runtime scenario failed: $previewTest (exit $LASTEXITCODE)"
            }
          }
      - name: Observe selected native DOM and owned shutdown on the installed runtime
        shell: python
        run: |
          import json
          import os
          import subprocess

          environment = os.environ.copy()
          environment["MOIRAI_WEBVIEW_STARTUP_OBSERVATION"] = json.dumps({
              "start_uri": "https://metis.invalid/index.html",
              "selectors": ["#host-status", "#result", "#missing-observer-fixture"],
          }, separators=(",", ":"))
          # The CLI process has a separate bound; nextest retains the existing
          # strict 60-second per-test profile and one owner-thread fixture.
          subprocess.run([
              "cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
              "--no-default-features", "--features", "webview2",
              "--config-file", ".config/nextest.toml", "--test-threads", "1",
              "--retries", "0", "--run-ignored", "only", "--no-tests", "fail", "-E",
              "test(=windows::webview::tests::startup::installed_runtime_observes_selected_dom_and_owned_shutdown)",
          ], env=environment, check=True, timeout=120)
          subprocess.run([
              "cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
              "--no-default-features", "--features", "webview2",
              "--config-file", ".config/nextest.toml", "--test-threads", "1",
              "--retries", "0", "--run-ignored", "only", "--no-tests", "fail", "-E",
              "test(=windows::webview::host::diagnostics::input::tests::installed_runtime_observes_controller_input_without_handling)",
          ], env=environment, check=True, timeout=120)
          subprocess.run([
              "cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
              "--no-default-features", "--features", "webview2",
              "--config-file", ".config/nextest.toml", "--test-threads", "1",
              "--retries", "0", "--run-ignored", "only", "--no-tests", "fail", "-E",
              "test(=windows::webview::host::diagnostics::input::tests::installed_runtime_restores_controller_input_after_native_parent_focus)",
          ], env=environment, check=True, timeout=120)
          subprocess.run([
              "cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
              "--no-default-features", "--features", "webview2",
              "--config-file", ".config/nextest.toml", "--test-threads", "1",
              "--retries", "0", "--run-ignored", "only", "--no-tests", "fail", "-E",
              "test(=windows::webview::host::diagnostics::session::tests::admission::installed_runtime_prioritizes_native_events_and_expired_admission)",
          ], env=environment, check=True, timeout=120)
          late_environment = environment.copy()
          late_selection = json.loads(late_environment["MOIRAI_WEBVIEW_STARTUP_OBSERVATION"])
          late_selection["late_input_after_key"] = 65
          late_environment["MOIRAI_WEBVIEW_STARTUP_OBSERVATION"] = json.dumps(late_selection, separators=(",", ":"))
          subprocess.run([
              "cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
              "--no-default-features", "--features", "webview2",
              "--config-file", ".config/nextest.toml", "--test-threads", "1",
              "--retries", "0", "--run-ignored", "only", "--no-tests", "fail",
              "--success-output", "immediate", "-E",
              "test(=windows::webview::host::diagnostics::input::tests::late::installed_runtime_retains_selected_late_controller_input)",
          ], env=late_environment, check=True, timeout=120)
      - name: Require ordinary, isolated and selected native UIA field delivery
        id: uia-matrix
        shell: python
        run: |
          import json
          import os
          import subprocess

          failures = []
          for mode in ("ordinary", "controller", "native", "events", "domain", "snapshot", "startup", "selected"):
              environment = os.environ.copy()
              environment.pop("MOIRAI_NATIVE_UIA_RENDERER_PROBE", None)
              environment["MOIRAI_NATIVE_UIA_OBSERVATION_MODE"] = mode
              if mode != "ordinary":
                  selection = {
                      "start_uri": "https://metis.invalid/index.html",
                      "selectors": ["#host-status", "#result", "#missing-observer-fixture"],
                  }
                  if mode != "selected":
                      selection["components"] = mode
                  environment["MOIRAI_WEBVIEW_STARTUP_OBSERVATION"] = json.dumps(selection, separators=(",", ":"))
              else:
                  environment.pop("MOIRAI_WEBVIEW_STARTUP_OBSERVATION", None)
              # Run every mode even if an earlier one fails; each retains the same
              # sixteen edits, sixty-four value checks and 30s client deadline.
              print(json.dumps({"native_uia_mode": mode, "stage": "start"}), flush=True)
              try:
                  result = subprocess.run([
                      "cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
                      "--no-default-features", "--features", "webview2",
                      "--config-file", ".config/nextest.toml", "--test-threads", "1",
                      "--retries", "0", "--run-ignored", "only", "--no-tests", "fail",
                      "--success-output", "immediate", "-E",
                      "test(=windows::webview::host::focus::tests::installed_runtime_delivers_uia_focused_unicode_replacements)",
                  ], env=environment, check=False, timeout=120)
                  print(json.dumps({"native_uia_mode": mode, "exit": result.returncode}), flush=True)
                  if result.returncode != 0:
                      failures.append({"mode": mode, "exit": result.returncode})
              except subprocess.TimeoutExpired as error:
                  failures.append({"mode": mode, "timeout_seconds": error.timeout})
          if failures:
              raise RuntimeError("Native UIA modes failed: " + json.dumps(failures, sort_keys=True))
      - name: Observe live renderer values after a returned persistent UIA mismatch
        if: ${{ always() && steps.uia-matrix.outcome != 'skipped' }}
        shell: python
        run: |
          import json
          import os
          import subprocess

          environment = os.environ.copy()
          environment["MOIRAI_NATIVE_UIA_OBSERVATION_MODE"] = "startup"
          environment["MOIRAI_NATIVE_UIA_RENDERER_PROBE"] = "1"
          environment["MOIRAI_WEBVIEW_STARTUP_OBSERVATION"] = json.dumps({
              "start_uri": "https://metis.invalid/index.html",
              "selectors": ["#host-status", "#result", "#missing-observer-fixture"],
              "components": "startup",
          }, separators=(",", ":"))
          subprocess.run([
              "cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
              "--no-default-features", "--features", "webview2",
              "--config-file", ".config/nextest.toml", "--test-threads", "1",
              "--retries", "0", "--run-ignored", "only", "--no-tests", "fail",
              "--success-output", "immediate", "-E",
              "test(=windows::webview::host::focus::tests::installed_runtime_delivers_uia_focused_unicode_replacements)",
          ], env=environment, check=True, timeout=120)
      - name: Compile the actual Rust native bridge payload
        shell: pwsh
        run: >-
          python scripts/webview/build_bridge.py
          --manifest-path "$env:GITHUB_WORKSPACE/Cargo.toml"
          --target-dir "$env:GITHUB_WORKSPACE/target"
          --output "$env:GITHUB_WORKSPACE/bridge-fixture-evidence"
      - name: Roundtrip the compiled Rust bridge and retire actual callbacks
        shell: python
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          environment = os.environ.copy()
          environment["MOIRAI_WEBVIEW_BRIDGE_FIXTURE"] = str(
              Path("bridge-fixture-evidence/payload").resolve(strict=True))
          environment["MOIRAI_WEBVIEW_STARTUP_OBSERVATION"] = json.dumps({
              "start_uri": "https://metis.invalid/index.html",
              "selectors": ["#fixture-status"],
          }, separators=(",", ":"))
          subprocess.run([
              "cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
              "--no-default-features", "--features", "webview2",
              "--config-file", ".config/nextest.toml", "--test-threads", "1",
              "--retries", "0", "--run-ignored", "only", "--no-tests", "fail",
              "--success-output", "immediate", "-E",
              "test(=windows::webview::tests::bridge::installed_runtime_roundtrips_rust_bridge_and_retires_closed_listeners)",
          ], env=environment, check=True, timeout=120)
      - name: Compile the separate actual Rust keyboard payload
        shell: pwsh
        run: >-
          python scripts/webview/build_bridge.py
          --fixture keyboard
          --manifest-path "$env:GITHUB_WORKSPACE/Cargo.toml"
          --target-dir "$env:GITHUB_WORKSPACE/target"
          --output "$env:GITHUB_WORKSPACE/keyboard-fixture-evidence"
      - name: Compare untouched and matched-call native browser-key policies
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          root = Path("keyboard-fixture-evidence").resolve(strict=True)
          payload = root / "payload"
          def identities():
              return {p.name: {"bytes": p.stat().st_size,
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
                      for p in sorted(payload.iterdir())}
          failures = []
          for policy in ("default", "enable_s", "skip_s"):
              environment = os.environ.copy()
              environment["MOIRAI_WEBVIEW_KEYBOARD_FIXTURE"] = str(payload)
              environment["MOIRAI_WEBVIEW_KEYBOARD_POLICY"] = policy
              environment["MOIRAI_WEBVIEW_KEYBOARD_EVIDENCE"] = str(root / (policy + ".json"))
              environment["MOIRAI_WEBVIEW_STARTUP_OBSERVATION"] = json.dumps({
                  "start_uri": "https://metis.invalid/index.html",
                  "selectors": ["#fixture-status"],
              }, separators=(",", ":"))
              command = ["cargo", "nextest", "run", "--locked", "-p", "moirai-pal", "--lib",
                  "--no-default-features", "--features", "webview2",
                  "--config-file", ".config/nextest.toml", "--test-threads", "1",
                  "--retries", "0", "--run-ignored", "only", "--no-tests", "fail",
                  "--success-output", "immediate", "-E",
                  "test(=windows::webview::host::keyboard_fixture::installed_runtime_compares_physical_shortcut_browser_policy)"]
              before = identities()
              started = time.monotonic()
              try:
                  result = subprocess.run(command, env=environment, capture_output=True, timeout=120)
                  code, stdout, stderr, timeout = result.returncode, result.stdout, result.stderr, False
              except subprocess.TimeoutExpired as error:
                  code, stdout, stderr, timeout = None, error.stdout or b"", error.stderr or b"", True
              (root / (policy + ".stdout")).write_bytes(stdout)
              (root / (policy + ".stderr")).write_bytes(stderr)
              sys.stdout.buffer.write(stdout)
              sys.stderr.buffer.write(stderr)
              after = identities()
              receipt = {"policy": policy, "command": command, "exit": code,
                  "timeout": timeout, "seconds": time.monotonic() - started,
                  "payload_before": before, "payload_after": after,
                  "stdout_sha256": hashlib.sha256(stdout).hexdigest(),
                  "stderr_sha256": hashlib.sha256(stderr).hexdigest()}
              (root / (policy + ".driver.json")).write_text(json.dumps(receipt, indent=2) + "\n")
              if code != 0 or timeout or before != after:
                  failures.append(receipt)
          if failures:
              raise RuntimeError("Native keyboard cells fail: " + json.dumps(failures))
          subprocess.run([sys.executable, "scripts/webview/keyboard_evidence.py",
              "--default", str(root / "default.json"),
              "--enable-s", str(root / "enable_s.json"),
              "--skip-s", str(root / "skip_s.json"),
              "--payload", str(payload), "--output", str(root / "comparison.json")],
              check=True, timeout=60)
      - name: Retain real keyboard payload, three cells and original output
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-rust-keyboard-counterfactual
          path: keyboard-fixture-evidence/
          if-no-files-found: ignore
      - name: Retain the original generated Rust bridge payload and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-rust-bridge-payload
          path: bridge-fixture-evidence/
          if-no-files-found: ignore
      # Query the same default SDK runtime selection used by the native host.
      # This is evidence after execution, never an installation or skip gate.
      - name: Record the native SDK selected runtime version
        if: ${{ always() }}
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.run([
              sys.executable, "-m", "unittest", "discover", "-s", "scripts/tests",
              "-p", "test_webview_runtime_version.py",
          ], check=True, timeout=60)
          subprocess.run([
              sys.executable, "scripts/webview/runtime_version.py",
          ], check=True, timeout=60)
