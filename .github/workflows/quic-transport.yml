name: Native QUIC transport

on:
  workflow_dispatch:
    inputs:
      case:
        description: Exact admitted profile, stream count and payload size
        required: false
        type: string
        default: ''
      profile:
        description: Record recovery events and CPU samples for this diagnostic
        type: boolean
        default: false
      reference:
        description: Run the identical workload on the Tokio/Quinn reference
        type: boolean
        default: false
  workflow_call:
    inputs:
      case:
        type: string
        default: ''
      profile:
        type: boolean
        default: false
      reference:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: QUIC ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest@0.9.143
          checksum: true
      - name: Check the native transport and consumers
        run: cargo clippy --locked -p moirai-pal -p moirai-async -p moirai-http -p moirai-quic -p moirai-runtime --all-targets -- -D warnings
      - name: Check the native PAL without optional WebView2
        run: cargo clippy --locked -p moirai-pal --no-default-features --lib -- -D warnings
      - name: Verify actual UDP, TLS rejection, framing and stream isolation
        run: cargo nextest run --locked -p moirai-pal -p moirai-async -p moirai-http -p moirai-quic -p moirai-runtime --tests --example quic_load --example quic_load_tokio
      - name: Verify required QUIC in minimal builds
        run: cargo nextest run --locked -p moirai-runtime --no-default-features --test quic

  profiles:
    name: QUIC controlled network profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      QUIC_PROBE: ${{ inputs.reference && 'target/release/examples/quic_load_tokio' || 'target/release/examples/quic_load' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the measured source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/quic-source-status"
          if test -s "$RUNNER_TEMP/quic-source-status"; then
            cat "$RUNNER_TEMP/quic-source-status"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
      - name: Build the pinned seeded-netem tool
        run: |
          git init "$RUNNER_TEMP/quic-iproute2"
          git -C "$RUNNER_TEMP/quic-iproute2" remote add origin https://git.kernel.org/pub/scm/network/iproute2/iproute2.git
          git -C "$RUNNER_TEMP/quic-iproute2" fetch --depth=1 origin d2a8ffe85ac64f91ee2aa7679a5046f321b54127
          git -C "$RUNNER_TEMP/quic-iproute2" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/quic-iproute2" -j2
      - name: Build both optimized transport probes
        run: |
          mkdir -p output/quic
          cargo build --locked --release -p moirai-quic --example quic_load --example quic_load_tokio --message-format=json-render-diagnostics > output/quic/build-messages.jsonl
      - name: Record the measured source and binaries
        shell: bash
        run: |
          rustc -Vv > output/quic/rustc-vv.txt
          moirai_binary="$(realpath target/release/examples/quic_load)"
          tokio_binary="$(realpath target/release/examples/quic_load_tokio)"
          jq -s \
            --arg manifest "$GITHUB_WORKSPACE/moirai-quic/Cargo.toml" \
            --arg moirai_binary "$moirai_binary" \
            --arg tokio_binary "$tokio_binary" \
            '[.[] | select(.reason == "compiler-artifact") |
              select(.manifest_path == $manifest) |
              select(.target.kind == ["example"]) |
              select(.target.name == "quic_load" or .target.name == "quic_load_tokio") |
              {name: .target.name, executable, features: (.features | sort), profile}] as $artifacts |
             if ($artifacts | length) != 2 then error("the release build did not emit exactly two QUIC example artifacts")
             elif ($artifacts | map(.name) | unique | length) != 2 then error("the release build emitted a duplicate QUIC example artifact")
             elif ($artifacts | map(.features) | unique | length) != 1 then error("the QUIC examples were built with different crate features")
             elif (($artifacts[] | select(.name == "quic_load").executable) != $moirai_binary or
                   ($artifacts[] | select(.name == "quic_load_tokio").executable) != $tokio_binary)
               then error("the compiler artifacts do not identify the measured binaries")
             else {moirai: ($artifacts[] | select(.name == "quic_load")),
                   tokio: ($artifacts[] | select(.name == "quic_load_tokio"))}
             end' output/quic/build-messages.jsonl > output/quic/build-artifacts.json
          jq -n \
            --arg candidate "$GITHUB_SHA" \
            --arg lock_sha256 "$(sha256sum Cargo.lock | cut -d ' ' -f 1)" \
            --arg moirai_sha256 "$(sha256sum target/release/examples/quic_load | cut -d ' ' -f 1)" \
            --arg tokio_sha256 "$(sha256sum target/release/examples/quic_load_tokio | cut -d ' ' -f 1)" \
            --arg selected_binary "$QUIC_PROBE" \
            --rawfile rustc output/quic/rustc-vv.txt \
            --slurpfile build output/quic/build-artifacts.json \
            '{schema: 1, candidate: $candidate, cargo_lock_sha256: $lock_sha256,
              binaries: {moirai: $moirai_sha256, tokio: $tokio_sha256},
              selected_binary: $selected_binary, profile: "release",
              build_artifacts: $build[0],
              rustc_vv: $rustc}' > output/quic/provenance.json
      - name: Record source status before measurement
        shell: bash
        run: |
          git status --porcelain --untracked-files=all > output/quic/source-status-before.txt
          if test -s output/quic/source-status-before.txt; then
            cat output/quic/source-status-before.txt
            exit 1
          fi
      - name: Check the diagnostic CPU sampler
        if: inputs.profile
        run: perf --version
      - name: Measure verified exchanges in task-owned namespaces
        if: ${{ !inputs.profile }}
        env:
          QUIC_PROFILE_CASE: ${{ inputs.case }}
        run: python3 scripts/quic_profiles.py --binary "$QUIC_PROBE" --network netem --tc "$RUNNER_TEMP/quic-iproute2/tc/tc" --case "$QUIC_PROFILE_CASE" --output output/quic/profiles.json
      - name: Diagnose the selected exchange with recovery events and CPU samples
        if: inputs.profile
        env:
          QUIC_PROFILE_CASE: ${{ inputs.case }}
        run: |
          test -n "$QUIC_PROFILE_CASE"
          mkdir -p output/quic
          rustc_dir="$(dirname "$(rustup which rustc)")"
          timeout --kill-after=30s 300s sudo env "PATH=$rustc_dir:$PATH" MOIRAI_QUIC_RECOVERY_TRACE=1 perf record -F 99 --call-graph dwarf -o output/quic/cpu.perf.data -- python3 scripts/quic_profiles.py --binary "$QUIC_PROBE" --network netem --tc "$RUNNER_TEMP/quic-iproute2/tc/tc" --case "$QUIC_PROFILE_CASE" --output output/quic/profiles.json
      - name: Render the diagnostic CPU samples
        if: ${{ always() && inputs.profile }}
        run: |
          sudo chown "$(id -u):$(id -g)" output/quic/cpu.perf.data output/quic/profiles.json
          perf report --stdio --input output/quic/cpu.perf.data > output/quic/cpu.txt
          perf script --input output/quic/cpu.perf.data -F dso > output/quic/cpu.commands
          normalize_dsos() { awk '{value = $0; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); if (substr(value, 1, 1) != "(" || substr(value, length(value), 1) != ")") next; value = substr(value, 2, length(value) - 2); sub(/^.*\//, "", value); print value}'; }
          printf '%s\n' ' (quic_load)' ' (/tmp/quic_load_tokio)' | normalize_dsos > "$RUNNER_TEMP/quic-dso-fixture"
          test "$(grep -Fxc quic_load "$RUNNER_TEMP/quic-dso-fixture")" -eq 1
          test "$(grep -Fxc quic_load_tokio "$RUNNER_TEMP/quic-dso-fixture")" -eq 1
          printf '%s\n' ' (/tmp/quic_load_toki)' | normalize_dsos > "$RUNNER_TEMP/quic-dso-wrong-prefix"
          if grep -Fxq quic_load "$RUNNER_TEMP/quic-dso-wrong-prefix" || grep -Fxq quic_load_tokio "$RUNNER_TEMP/quic-dso-wrong-prefix"; then exit 1; fi
          normalize_dsos < output/quic/cpu.commands | sort -u > output/quic/cpu.dso-names
          grep -Fxq "$(basename "$QUIC_PROBE")" output/quic/cpu.dso-names
      - name: Record source status after measurement
        if: always()
        shell: bash
        run: |
          mkdir -p output/quic
          git status --porcelain --untracked-files=all > output/quic/source-status-after.txt
          if test -s output/quic/source-status-after.txt; then
            cat output/quic/source-status-after.txt
            exit 1
          fi
      - name: Preserve complete measurements and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.reference && 'quic-controlled-tokio' || 'quic-controlled' }}-${{ inputs.case != '' && 'diagnostic' || 'profiles' }}-${{ github.run_id }}
          path: output/quic/
          if-no-files-found: error
          retention-days: 7
