name: Rust Workspace

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/build.rs"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/build.rs"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Workspace gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.97.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140
          checksum: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo nextest run --locked --workspace --all-features

      - name: Check workspace doctests
        run: cargo test --locked --workspace --all-features --doc

      - name: Build warning-free Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  loom:
    name: Loom channel models
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.97.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140
          checksum: true

      - name: Run channel and executor interleaving models
        run: >-
          cargo nextest run --locked
          -p moirai-core --test loom_mpmc_waiter --test loom_spsc_ring
          -p moirai-async --test loom_wake_dedup --test loom_connection_pool
          --release
