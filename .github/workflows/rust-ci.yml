name: Rust Workspace

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/build.rs"
      - "fuzz/seeds/**"
      - ".cargo/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"
  schedule:
    # Weekly parser-fuzz campaign (MOI-SEC-001-B) and Miri run; main only.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: rust-workspace-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # Public-surface compatibility, informational on pull requests: the
  # detected change class is visible while the change is still in
  # review. The blocking comparison runs on release.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@b44c45c3875c9c03ac9fc83994ee068c1805bb49
    with:
      package: moirai-async-macros,moirai-async,moirai-core,moirai-crypto,moirai-executor,moirai-gpu,moirai-http,moirai-iter,moirai-metrics,moirai-pal,moirai-parallel,moirai-scheduler,moirai-sync,moirai-tls,moirai-transport,moirai-utils,moirai-runtime
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  adr-index:
    name: ADR index is current
    # atlas owns the one generator (ATLAS-ADR-FORM-NORMALIZATION-2026-09-02); strict: the ADRs carry the canonical heading form and numbering.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@191617bffed5f78de9d840fee8755963fccaaa67
    permissions:
      contents: read
    with:
      strict: true

  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  gate:
    name: Workspace gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.97.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140
          checksum: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo nextest run --locked --workspace --all-features

      # Criterion runs each benchmark once when its binary is not given
      # `--bench`; nextest lists them as tests, so every one runs under the
      # committed per-test budget. This proves the benches build and complete,
      # never how fast they are.
      - name: Smoke-run every benchmark once
        run: cargo nextest run --locked -p moirai-benchmarks --all-features --benches

      - name: Check workspace doctests
        run: cargo test --locked --workspace --all-features --doc

      - name: Build warning-free Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  msrv:
    name: Rust 1.95 floor check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The install step sets a rustup *default*; the committed rust-toolchain.toml
      # (1.97.0) outranks it. RUSTUP_TOOLCHAIN outranks the file, so this job
      # really compiles at the declared rust-version floor.
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Prove the toolchain under test
        run: rustc --version && cargo --version

      - name: Check the workspace at the floor
        run: cargo check --locked --workspace --all-features --all-targets

  loom:
    name: Loom channel models
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.97.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140
          checksum: true

      - name: Run channel and executor interleaving models
        run: >-
          cargo nextest run --locked
          -p moirai-core --test loom_mpmc_waiter --test loom_spsc_ring
          -p moirai-async --test loom_wake_dedup --test loom_connection_pool
          -p moirai-iter --test loom_retained_ready_set
          -p moirai-scheduler
          --test loom_chase_lev
          --test loom_chase_lev_resize_gate
          --test loom_chase_lev_slot_claim
          -p moirai-executor
          --test loom_wake_handshake
          --test loom_join_quiescence
          --test loom_scope_completion
          --test loom_task_waiters
          --test loom_lifo_slot
          --test loom_queue_handoff
          --test loom_shutdown_admission
          --release

  supply-chain:
    name: Supply-chain
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1


  fuzz:
    name: Fuzz parsers
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # Entry cold setup/build plus one 180-second campaign completed in 263
    # seconds. The second campaign runs concurrently; six minutes preserves
    # bounded infrastructure slack.
    timeout-minutes: 6
    # Highest toolchain-selection precedence: without this, the repo's
    # rust-toolchain.toml (1.97.0 stable) overrides any rustup default and
    # libFuzzer's -Z flags fail to build.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select fuzz verification mode
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=campaign" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

          mode=skip
          while IFS= read -r path; do
            case "$path" in
              fuzz/* | \
              moirai-http/* | \
              moirai-async/Cargo.toml | moirai-async/src/io/* | \
              moirai-core/Cargo.toml | moirai-core/src/ipc/* | \
              moirai-executor/Cargo.toml | moirai-executor/src/lib.rs | \
              moirai-executor/src/schedule/wake/* | \
              Cargo.toml | rust-toolchain.toml | .cargo/* | \
              .github/workflows/rust-ci.yml)
                mode=smoke
                break
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # Pinned nightly: libFuzzer builds track the unstable surface, and an
      # unpinned nightly would drift the toolchain under the gate.
      - name: Set up pinned nightly Rust
        if: steps.scope.outputs.mode != 'skip'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly-2026-08-01
          targets: x86_64-unknown-linux-gnu

      - name: Assert the fuzz toolchain
        if: steps.scope.outputs.mode != 'skip'
        run: |
          actual="$(rustc --version)"
          echo "fuzz toolchain: $actual"
          case "$actual" in
            *nightly*) ;;
            *) echo "ERROR: fuzz job requires a nightly compiler, got $actual" >&2; exit 1 ;;
          esac

      - name: Verify the fuzz lockfile
        if: steps.scope.outputs.mode != 'skip'
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Install cargo-fuzz
        if: steps.scope.outputs.mode != 'skip'
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-fuzz@0.13.2
          checksum: true

      # The target is explicit because cargo-fuzz defaults it to the triple
      # cargo-fuzz itself was built for, and cargo-binstall fetches the musl
      # build. A musl target implies `+crt-static`, and libFuzzer always builds
      # with `-Zsanitizer=address`, which rustc rejects against a statically
      # linked libc:
      #
      #   error: sanitizer is incompatible with statically linked libc,
      #          disable it using `-C target-feature=-crt-static`
      #
      # Naming the gnu target fixes the cause. Installing the musl target
      # instead only moved the failure one step later.
      - name: Build all fuzz targets
        if: steps.scope.outputs.mode != 'skip'
        working-directory: fuzz
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

      - name: Execute every committed parser seed
        if: steps.scope.outputs.mode == 'smoke'
        working-directory: fuzz
        shell: bash
        run: |
          targets=(http_response ipc_layout)
          for target in "${targets[@]}"; do
            mapfile -d '' seeds < <(find "seeds/$target" -type f -print0 | sort -z)
            if (( ${#seeds[@]} == 0 )); then
              echo "ERROR: $target has no committed seeds" >&2
              exit 1
            fi
            for seed in "${seeds[@]}"; do
              cargo fuzz run --target x86_64-unknown-linux-gnu \
                "$target" "$seed" -- -runs=1 -rss_limit_mb=4096
            done
          done

      - name: Run bounded parser mutation campaigns
        if: steps.scope.outputs.mode == 'campaign'
        working-directory: fuzz
        shell: bash
        run: |
          targets=(http_response ipc_layout)
          declare -a pids
          for target in "${targets[@]}"; do
            corpus="$RUNNER_TEMP/moirai-fuzz/$target"
            mkdir -p "$corpus"
            cp -a "seeds/$target/." "$corpus/"
            cargo fuzz run --target x86_64-unknown-linux-gnu \
              "$target" "$corpus" -- \
              -max_total_time=180 -rss_limit_mb=4096 &
            pids+=("$!")
          done

          status=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "ERROR: ${targets[$index]} campaign failed" >&2
              status=1
            fi
          done
          exit "$status"

  # Miri interprets the unsafe-heavy library tests under both borrow-model
  # checkers, so the pointer-provenance defect classes fixed in the executor
  # registry lease, the scoped-job completion, and the queue and deque storage
  # stay fixed. Scheduled and dispatch-only: interpretation is far slower than
  # native execution, so it is not a pull-request gate. A skipped job passes
  # the verdict below.
  #
  # Each group below is the set that passed under Miri on the Linux target at
  # nightly-2026-08-01 (revision 3c78f661), with the wall time measured for it
  # under stacked-borrows and, in the tree-borrows column of each comment,
  # under tree-borrows. Left out, each with its cause:
  #   moirai-executor registry::retention_tests::concurrent_producers_and_
  #     sweeps_keep_every_task_observable_as_completed (about 307 s) and
  #     moirai-sync test_sharded_resource_pool_concurrent_recycle_respects_
  #     total_cap (over 400 s): over the per-test budget of about 60 s.
  #   moirai-core ipc:: and moirai-async net::: shm_open and socket options
  #     are unsupported operations under Miri.
  #   moirai-async executor:: and timer::: the tests pass, then Miri fails the
  #     run because worker threads outlive the main thread.
  #   moirai-iter parallel::sorting nested_sorts_complete_from_scheduler_
  #     workers (2,710 s), the deep_* tests, and cache::tests::zero_copy_for_
  #     each_accepts_wide_elements: over the per-test budget; the merge step
  #     they exercise is covered by merge_interleaves_two_sorted_runs_stably.
  # The backlog item ISSUE-005 carries the triage of the failures above.
  miri:
    name: Miri (${{ matrix.borrow_model }}, ${{ matrix.suite }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # The slowest cell is the executor suite under tree-borrows: 669 s of
    # interpretation locally, while a second Miri run shared the host. The cold
    # Miri sysroot and dependency build add minutes and the hosted runner is
    # slower than the measuring host, so 45 minutes is about four times the
    # measured run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        borrow_model: [stacked-borrows, tree-borrows]
        suite: [executor, foundation]
    env:
      # Highest toolchain-selection precedence, for the reason the fuzz job
      # gives: rust-toolchain.toml would otherwise select stable, which has no
      # Miri. Same pinned nightly as the fuzz job.
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
      # A fixed seed keeps the interpreter's scheduling reproducible; host
      # isolation is off because the tests wait on real time and host services.
      MIRIFLAGS: -Zmiri-seed=1 -Zmiri-disable-isolation ${{ matrix.borrow_model == 'tree-borrows' && '-Zmiri-tree-borrows' || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned nightly Rust with Miri
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly-2026-08-01
          components: miri, rust-src

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: false
          cache-directories: ~/.cache/miri

      - name: Assert the Miri toolchain
        run: |
          rustc --version
          cargo miri --version

      # Each group records its wall seconds as stacked-borrows / tree-borrows
      # and names its slowest tests.
      - name: Interpret the executor lease, scope, and queue tests
        if: matrix.suite == 'executor'
        # 527 s / 660 s in all (90 tests); slowest, stacked-borrows: scope
        # recursive_fork_join 186, hybrid retention 82 and 58.
        # registry::tests:: includes the cancel_before_start regression, and
        # schedule::queue includes the queue shrink tests.
        run: >-
          cargo miri test --locked -p moirai-executor --lib --
          hybrid:: schedule::job schedule::queue
          schedule::runtime::tests::scope registry::tests:: registry::state
          -Zunstable-options --report-time --test-threads=1

      - name: Interpret the scheduler deque tests
        if: matrix.suite == 'foundation'
        # 20 s / 26 s in all (32 tests, including deque::shrink_tests);
        # slowest: chase_lev_stealer_capacity_is_monotone 13 / 16.
        run: >-
          cargo miri test --locked -p moirai-scheduler --lib --
          -Zunstable-options --report-time --test-threads=1

      - name: Interpret the utility queue and result-cell tests
        if: matrix.suite == 'foundation'
        # 19 s / 29 s including the cargo invocation (45 tests); slowest:
        # lock_free_queue_concurrent_mpmc, about 14 s.
        run: >-
          cargo miri test --locked -p moirai-utils --lib --
          -Zunstable-options --report-time --test-threads=1

      - name: Interpret the synchronization primitive tests
        if: matrix.suite == 'foundation'
        # 94 s / 120 s in all (19 tests); slowest:
        # futex_mutex_blocking_path_no_lost_wakeup 64 / 82 (about the budget).
        run: >-
          cargo miri test --locked -p moirai-sync --lib --
          --skip test_sharded_resource_pool_concurrent_recycle_respects_total_cap
          -Zunstable-options --report-time --test-threads=1

      - name: Interpret the core channel, pool, and ring tests
        if: matrix.suite == 'foundation'
        # About 115 s / 145 s in all (85 tests); slowest: hybrid
        # recv_delivers_last_message_under_park_unpark_churn 22 / 27. The
        # five mpmc tests take 49 s / 62 s together; the capacity-one stress
        # tests run reduced counts under `cfg!(miri)`.
        run: >-
          cargo miri test --locked -p moirai-core --lib --
          --skip ipc::
          -Zunstable-options --report-time --test-threads=1

      - name: Interpret the iterator slot and output tests
        if: matrix.suite == 'foundation'
        # About 12 s / 16 s in all (34 tests); slowest:
        # ordered_outputs_cross_geometric_blocks_and_ragged_tail 1.8 / 2.9.
        run: >-
          cargo miri test --locked -p moirai-iter --lib --
          stream::slots parallel::output parallel::adapters
          parallel::sorting::tests::merge_interleaves_two_sorted_runs_stably
          -Zunstable-options --report-time --test-threads=1

      - name: Interpret the async synchronization tests
        if: matrix.suite == 'foundation'
        # 50 s / 115 s in all (45 tests); slowest: test_semaphore_async
        # 9.5 / 22.
        run: >-
          cargo miri test --locked -p moirai-async --lib --
          sync::
          -Zunstable-options --report-time --test-threads=1

  # The one job the branch protection requires. A job that fails in this
  # workflow, or is cancelled, fails this one; a job skipped by its own
  # condition passes, so a draft pull request is failed here on purpose and
  # cannot leave a stale green result once it is marked ready. Requiring the
  # individual jobs by name instead let a red `Fuzz parsers` run merge, because
  # only the two jobs named in the protection were checked. The informational
  # SemVer job is not part of the result.
  verdict:
    name: Verification result
    if: ${{ always() }}
    needs: [adr-index, lockfile, gate, msrv, loom, supply-chain, fuzz, miri]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every job to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "A draft pull request is not verified: mark it ready to run the gate." >&2
            exit 1
          fi
          if ! jq -e '[.[].result] | all(. != "failure" and . != "cancelled")' <<<"$NEEDS" >/dev/null; then
            jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$NEEDS" >&2
            exit 1
          fi
