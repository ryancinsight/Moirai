# Job-level timeout-minutes so unbounded jobs do not surface to the
# scanner workflow_missing_timeout ratchet (Atlas audit sweep, step 4).
# GitHub defaults.run supports only shell/working-directory, so the
# bound is declared per job; steps inherit it.
name: Python Bindings

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths: ["moirai-python/**", "Cargo.toml", "Cargo.lock", ".github/workflows/python-ci.yml"]
  push:
    branches: [main]
    paths: ["moirai-python/**", "Cargo.toml", "Cargo.lock", ".github/workflows/python-ci.yml"]

permissions:
  contents: read

concurrency:
  group: python-bindings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    name: Rust binding checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140
          checksum: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint binding targets
        run: cargo clippy --locked -p moirai-python --all-features --all-targets -- -D warnings

      - name: Test native binding crate
        run: cargo nextest run --locked -p moirai-python --all-features

      - name: Test shared-memory mapping invariants
        run: cargo nextest run --locked -p moirai-core --no-default-features --features std

      - name: Test binding documentation
        run: cargo test --locked -p moirai-python --all-features --doc

  wheel:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    name: ${{ matrix.os }} wheel smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
          - os: windows-latest
            target: x86_64
            manylinux: "off"
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: "off"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Build production wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          sccache: true
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path moirai-python/Cargo.toml
            --out dist
            -i ${{ matrix.os == 'ubuntu-latest' && 'python3.13' || 'python' }}

      - name: Install and exercise wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
          python -m unittest discover moirai-python/tests
