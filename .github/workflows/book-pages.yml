name: Deploy mdBook



on:

  push:

    branches: [main]

    paths:

      - "docs/book/**"

      - ".github/workflows/book-pages.yml"

  pull_request:

    types: [opened, reopened, synchronize, ready_for_review]

    paths:

      - "docs/book/**"

      - ".github/workflows/book-pages.yml"

  workflow_dispatch:



permissions:

  contents: read



concurrency:

  group: book-pages-${{ github.ref }}

  # Deploys queue behind one another; a half-cancelled deploy is worse than a
  # superseded one, and a cancelled default-branch run leaves that merge undeployed.
  cancel-in-progress: false



jobs:

  deploy:

    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@20c93980f7c98f2e23a89c4a0540f16c8f2d7239

    permissions:

      contents: read

      pages: write

      id-token: write

    with:

      output-path: target/book/moirai

      mdbook-test: true

      rust-toolchain: "1.97.0"

      cargo-package: moirai-runtime

      cargo-crate: moirai
