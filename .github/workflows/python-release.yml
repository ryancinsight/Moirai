# Job-level timeout-minutes so unbounded jobs do not surface to the
# scanner workflow_missing_timeout ratchet (Atlas audit sweep, step 4).
# GitHub defaults.run supports only shell/working-directory, so the
# bound is declared per job; steps inherit it.
name: Python Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  wheels:
    # Reusable-workflow callers accept no timeout-minutes; the bound lives
    # inside ryancinsight/atlas/.github/workflows/python-wheels.yml.
    if: startsWith(github.event.release.tag_name, 'moirai-python-v')
    name: Build and attach wheels
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ryancinsight/atlas/.github/workflows/python-wheels.yml@d15afbf5ad2c4126cfb174ea4f5e4a2b970d1ddf
    with:
      distribution: moirai-python
      import-name: moirai_python
      manifest-path: moirai-python/Cargo.toml
      atlas-ref: d15afbf5ad2c4126cfb174ea4f5e4a2b970d1ddf
      tag-prefix: moirai-python-v
      abi3: false
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'

  publish:
    timeout-minutes: 30
    if: startsWith(github.event.release.tag_name, 'moirai-python-v')
    name: Publish wheels to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/moirai-python
    permissions:
      id-token: write
    steps:
      - name: Download validated release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheels
          path: dist

      - name: Publish wheels through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          print-hash: true
