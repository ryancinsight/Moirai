name: QUIC recovery comparison

on:
  workflow_dispatch:
    inputs:
      reference:
        description: Optional commit or ref to diagnose
        required: false
        type: string
      case:
        description: Optional admitted matrix case; runs Cubic at all three existing repetitions
        required: false
        type: string
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'moirai-quic/src/**'
      - 'moirai-quic/examples/**'
      - 'scripts/quic*.py'
      - 'scripts/tests/test_quic*.py'
      - 'scripts/quic_observation/**'
      - '.github/workflows/quic-recovery.yml'

permissions:
  contents: read

concurrency:
  group: quic-recovery-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: Recovery ${{ matrix.suite }} repetition ${{ matrix.repetition }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.case != '' && '["matrix"]' || '["matrix","fairness"]') }}
        repetition: [0, 1, 2]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.reference || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest@0.9.140
          checksum: true
      - name: Fetch all locked target sources for offline provenance
        run: cargo fetch --locked
      - name: Verify the original domain and archived numerical evidence
        run: python3 -m unittest discover -s scripts/tests -p 'test_quic*.py'
      - name: Build the original seeded-netem tool
        run: |
          git init "$RUNNER_TEMP/quic-iproute2"
          git -C "$RUNNER_TEMP/quic-iproute2" remote add origin https://git.kernel.org/pub/scm/network/iproute2/iproute2.git
          git -C "$RUNNER_TEMP/quic-iproute2" fetch --depth=1 origin d2a8ffe85ac64f91ee2aa7679a5046f321b54127
          git -C "$RUNNER_TEMP/quic-iproute2" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/quic-iproute2" -j2
      - name: Build the authenticated byte-verifying probe
        run: |
          python3 scripts/quic_observation/prepare.py --output "$RUNNER_TEMP/quic-observation"
          mkdir -p "$RUNNER_TEMP/quic-observation/workspace/.cargo"
          cp "$RUNNER_TEMP/quic-observation/config.toml" "$RUNNER_TEMP/quic-observation/workspace/.cargo/config.toml"
          cargo clippy --config "$RUNNER_TEMP/quic-observation/config.toml" --locked --release --manifest-path "$RUNNER_TEMP/quic-observation/workspace/Cargo.toml" -p moirai-quic --example quic_load --example quic_load_tokio -- -D warnings
          cargo build --config "$RUNNER_TEMP/quic-observation/config.toml" --locked --release --manifest-path "$RUNNER_TEMP/quic-observation/workspace/Cargo.toml" -p moirai-quic --example quic_load --example quic_load_tokio
      - name: Verify both probes aggregate actual recovery events
        run: |
          cargo nextest run --config "$RUNNER_TEMP/quic-observation/config.toml" --locked \
            --manifest-path "$RUNNER_TEMP/quic-observation/workspace/Cargo.toml" \
            -p moirai-quic --all-targets \
            -E 'binary(quic_load) | binary(quic_load_tokio)'
      - name: Compare all stock policies with unchanged deadlines and workloads
        env:
          SUITE: ${{ matrix.suite }}
          REPETITION: ${{ matrix.repetition }}
          CASE: ${{ inputs.case }}
          MOIRAI_QUIC_RECOVERY_TRACE: '1'
          MOIRAI_QUIC_ENGINE_OBSERVATION: ${{ runner.temp }}/quic-observation/provenance.json
        run: >-
          python3 scripts/quic_recovery.py
          --binary target/release/examples/quic_load
          --tc "$RUNNER_TEMP/quic-iproute2/tc/tc"
          --suite "$SUITE" --repetition "$REPETITION"
          --case "$CASE"
          --output "output/quic-recovery/$SUITE-$REPETITION.json"
      - name: Preserve complete results, failures and queue samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quic-recovery-${{ matrix.suite }}-${{ matrix.repetition }}-${{ github.run_id }}
          path: output/quic-recovery/
          if-no-files-found: error
          retention-days: 7
