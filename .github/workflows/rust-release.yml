name: Crates.io Release

on:
  release:
    types: [published]
  push:
    branches: [main]
  schedule:
    - cron: "4 6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package || github.event_name }}
  cancel-in-progress: false

jobs:
  verification:
    name: Require verified main revision
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Require the complete main-branch gate at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/rust-ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=100" > "$RUNNER_TEMP/release-verification.json"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '[.[].workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo and .event == "push" and .conclusion == "success")] | length > 0' "$RUNNER_TEMP/release-verification.json"

  release-preflight:
    needs: verification
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ./.github/workflows/release-preflight.yml
    permissions:
      contents: read

  # A public-surface break the manifest version does not cover
  # stops the release here. The baseline is the latest published
  # version, so the list is the crates the registry carries.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate (release)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@0227830912a12dbae0ff62b3f16575899fc9087e
    with:
      release-gate: true
      package: moirai-async,moirai-async-macros,moirai-core,moirai-crypto,moirai-executor,moirai-gpu,moirai-http,moirai-iter,moirai-metrics,moirai-pal,moirai-parallel,moirai-quic,moirai-runtime,moirai-scheduler,moirai-sync,moirai-tls,moirai-transport,moirai-utils
      rust-toolchain: 1.97.0
      atlas-ref: 0227830912a12dbae0ff62b3f16575899fc9087e
    permissions:
      contents: read

  publish:
    needs: semver
    # Gate stays here: the shared validate job has no prefix check and fails
    # closed, so a legacy tag would go from a silent skip to a red run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action.
    uses: ryancinsight/atlas/.github/workflows/crates-publish.yml@4c31dd753f06dd93b4c04798cf781df253e3e532
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
      dispatch-package: ${{ inputs.package }}
      dispatch-version: ${{ inputs.version }}

  # Version-change publishing (ADR 0068): a merged manifest version bump or the
  # daily schedule publishes whatever the registry lacks. Only this job holds
  # the tag-creating and OIDC permissions; the release and dispatch jobs above
  # skip on push and schedule events.
  publish-pending:
    needs: release-preflight
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ryancinsight/atlas/.github/workflows/crates-publish-pending.yml@0227830912a12dbae0ff62b3f16575899fc9087e
    permissions:
      contents: write # release tags for the published versions
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
