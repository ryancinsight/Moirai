name: Crates.io Release

on:
  release:
    types: [published]
  push:
    branches: [main]
  schedule:
    - cron: "4 6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package || github.event_name }}
  cancel-in-progress: false

jobs:
  # Release and dispatch each validate exactly one Cargo package. An unrelated
  # crate with unreleased changes must not become part of this release.
  release-package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      package: ${{ steps.select.outputs.package }}
    steps:
      - id: select
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_PACKAGE: ${{ inputs.package }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'release' ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^crate-([A-Za-z0-9][A-Za-z0-9_-]*)-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
              echo "Expected crate-<package>-v<version> release tag" >&2
              exit 1
            fi
            package="${BASH_REMATCH[1]}"
          else
            package="$DISPATCH_PACKAGE"
          fi
          if [[ ! "$package" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "Expected one Cargo package name" >&2
            exit 1
          fi
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"

  semver:
    name: SemVer gate (release)
    needs: release-package
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@0227830912a12dbae0ff62b3f16575899fc9087e
    with:
      release-gate: true
      package: ${{ needs.release-package.outputs.package }}
      rust-toolchain: 1.97.0
      atlas-ref: 0227830912a12dbae0ff62b3f16575899fc9087e
    permissions:
      contents: read

  publish:
    needs: semver
    # Gate stays here: the shared validate job has no prefix check and fails
    # closed, so a legacy tag would go from a silent skip to a red run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action.
    uses: ryancinsight/atlas/.github/workflows/crates-publish.yml@4c31dd753f06dd93b4c04798cf781df253e3e532
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
      dispatch-package: ${{ inputs.package }}
      dispatch-version: ${{ inputs.version }}

  # Automatic publishing is intentionally unarmed: pushes and schedules pass
  # an empty cohort, so the publisher plans zero packages before authentication.
  # A later explicitly authorized release change may activate the complete
  # workspace cohort after its release gates pass. Only this job holds the
  # tag-creating and OIDC permissions; release and dispatch skip these events.
  publish-pending:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ryancinsight/atlas/.github/workflows/crates-publish-pending.yml@0227830912a12dbae0ff62b3f16575899fc9087e
    permissions:
      contents: write # release tags for the published versions
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
      cohort-json: '{}'
