block2 = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = "0.3.2"

[dev-dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
