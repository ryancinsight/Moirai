[package]
name = "moirai-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false
description = "PyO3 bindings for the Moirai concurrency runtime"
documentation = "https://docs.rs/moirai-python"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = ["moirai/parallel"]
mnemosyne-memory = ["moirai/mnemosyne-memory"]

[dependencies]
moirai = { package = "moirai-runtime", path = "../moirai", version = "0.5.0" }
pyo3 = { workspace = true, features = ["extension-module"] }

[lints]
workspace = true
