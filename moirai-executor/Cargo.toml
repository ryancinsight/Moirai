[package]
name = "moirai-executor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Hybrid executor implementation for Moirai concurrency library"

[dependencies]
moirai-core = { workspace = true }
moirai-scheduler = { workspace = true }
moirai-utils = { workspace = true }
moirai-pal = { workspace = true }
mnemosyne = { workspace = true, optional = true }
melinoe = { workspace = true, features = ["std"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = ["std", "metrics", "async", "parallel", "mnemosyne-memory"]
std = []
async = []
parallel = []
numa = []
metrics = ["moirai-core/metrics"]
registry-diagnostics = []
scheduler-diagnostics = []
mnemosyne = ["dep:mnemosyne"]
mnemosyne-memory = ["mnemosyne"]
