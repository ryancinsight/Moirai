[package]
name = "moirai-executor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/moirai-executor"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Hybrid executor implementation for Moirai concurrency library"

[dependencies]
moirai-core = { workspace = true }
moirai-scheduler = { workspace = true }
moirai-utils = { workspace = true }
moirai-pal = { workspace = true }
mnemosyne = { workspace = true, optional = true }
melinoe = { workspace = true, features = ["std"] }
themis = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "blocking_lane"
harness = false

# loom model checker — only compiled under `--cfg loom` (see tests/loom_wake_handshake.rs).
[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

# Register the `loom` cfg so the gate stays warning-clean (it is set via
# `RUSTFLAGS="--cfg loom"`, not a Cargo feature).
[features]
default = ["metrics", "mnemosyne"]
metrics = ["moirai-core/metrics"]
registry-diagnostics = []
scheduler-diagnostics = []
mnemosyne = ["dep:mnemosyne"]
numa = ["moirai-core/numa", "moirai-scheduler/numa"]

[lints]
workspace = true
