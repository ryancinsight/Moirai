[package]
name = "moirai-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/moirai-scheduler"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Work-stealing scheduler implementation for Moirai concurrency library"

[dependencies]
moirai-core = { workspace = true }
moirai-utils = { workspace = true }
num_cpus = "1.16"
mnemosyne = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
static_assertions = "1.1"

# Loom model checker — only compiled under `--cfg loom` so the models exercise
# the same gate transition code as production (see tests/loom_chase_lev*.rs).
[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

# Register the `loom` cfg so the gate stays warning-clean (it is set via
# `RUSTFLAGS="--cfg loom"`, not a Cargo feature).
[features]
default = ["parallel", "mnemosyne-memory"]
parallel = []
metrics = ["moirai-core/metrics"]
mnemosyne = ["dep:mnemosyne", "moirai-core/mnemosyne"]
mnemosyne-memory = ["mnemosyne"]

[lints]
workspace = true
