[package]
name = "moirai-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Work-stealing scheduler implementation for Moirai concurrency library"

[dependencies]
moirai-core = { workspace = true }
moirai-utils = { workspace = true }
num_cpus = "1.16"
themis = { workspace = true }
mnemosyne = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
static_assertions = "1.1"

# loom model checker — only compiled under `--cfg loom` (see tests/loom_chase_lev.rs).
[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

# Register the `loom` cfg so the gate stays warning-clean (it is set via
# `RUSTFLAGS="--cfg loom"`, not a Cargo feature).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = []
numa = []
metrics = ["moirai-core/metrics"]
mnemosyne = ["dep:mnemosyne", "moirai-core/mnemosyne"]
mnemosyne-memory = ["mnemosyne"]
