[package]
name = "moirai-pal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/moirai-pal"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Platform Abstraction Layer for Moirai async I/O operations"

[dependencies]
moirai-core = { workspace = true }
melinoe = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "CanvasRenderingContext2d",
    "Node",
    "File",
    "FileReader", 
    "Blob",
    "Window",
    "ReadableStream",
    "WritableStream",
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "InputEvent",
    "CompositionEvent",
    "DragEvent",
    "DataTransfer",
    "FileList",
    "ImageData",
] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
futures = "0.3"

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = []
mnemosyne-memory = []
metrics = ["moirai-core/metrics"]

[lints]
workspace = true
