[package]
name = "moirai-pal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/moirai-pal"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Platform Abstraction Layer for Moirai async I/O operations"

[dependencies]
moirai-core = { workspace = true }
melinoe = { workspace = true, features = ["std"] }
tracing.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
# Non-blocking socket creation for `AsyncTcpStream::connect`: std offers only
# the blocking `TcpStream::connect`.
socket2 = "0.6.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# CapturePreview PNG validation is part of the production WebView2 host.
png = { version = "0.18.1", optional = true }
accesskit = "0.25.1"
accesskit_windows = "0.35.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
webview2-com = { version = "0.39.1", optional = true }
# The SDK implementation macro names this actual crate in generated COM ABI.
windows-core = { version = "0.62.2", optional = true }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Wdk_Foundation",
    "Wdk_System_IO",
    "Wdk_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "console",
    "CssStyleDeclaration",
    "Document",
    "Clipboard",
    "DomMatrixReadOnly",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlSlotElement",
    "CanvasRenderingContext2d",
    "Node",
    "File",
    "Blob",
    "Response",
    "Request",
    "RequestInit",
    "RequestCache",
    "RequestCredentials",
    "RequestRedirect",
    "Headers",
    "AbortController",
    "AbortSignal",
    "ShadowRoot",
    "Url",
    "UrlSearchParams",
    "Window",
    "Navigator",
    "Geolocation",
    "Position",
    "PositionError",
    "PositionOptions",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "DomException",
    "Notification",
    "NotificationPermission",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "WritableStream",
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "PointerEvent",
    "WheelEvent",
    "InputEvent",
    "CompositionEvent",
    "DragEvent",
    "DataTransfer",
    "FileList",
    "History",
    "Location",
    "PopStateEvent",
    "ImageData",
] }

[dev-dependencies]
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3.34"
png = "0.18.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
# A browser has no OS child-process fork; shrinking and real browser RNG remain.
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }

[[example]]
name = "webview_bridge_fixture"
crate-type = ["cdylib"]

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = []
mnemosyne-memory = []
metrics = ["moirai-core/metrics"]
webview2 = ["dep:png", "dep:serde", "dep:serde_json", "dep:webview2-com", "dep:windows-core"]

[lints]
workspace = true
