[package]
name = "moirai-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/ryancinsight/Moirai/tree/main/tests"
publish = false
description = "Integration tests for Moirai concurrency library"

[dependencies]
moirai = { package = "moirai-runtime", path = "../moirai", version = "0.6.0", features = ["full", "tokio-compat"] }
moirai-utils = { path = "../moirai-utils", version = "0.6.0", features = ["std"] }
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"
futures = "0.3"
fastrand = "2.0"

[lints]
workspace = true
