[package]
name = "moirai-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Integration tests for Moirai concurrency library"

[dependencies]
moirai = { path = "../moirai", features = ["full", "tokio-compat"] }
moirai-core = { path = "../moirai-core" }
moirai-scheduler = { path = "../moirai-scheduler" }
moirai-transport = { path = "../moirai-transport" }
moirai-sync = { path = "../moirai-sync" }
moirai-utils = { path = "../moirai-utils", features = ["std"] }
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"
futures = "0.3"
proptest = { workspace = true }
quickcheck = { workspace = true }
quickcheck_macros = { workspace = true }
fastrand = "2.0"

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = []
mnemosyne-memory = []
expensive-tests = []
property-tests = []
quickcheck-tests = []
grasp-tests = []
acid-tests = []
principle-tests = []
