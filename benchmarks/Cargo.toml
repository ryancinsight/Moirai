[package]
name = "moirai-benchmarks"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
authors = ["Moirai Contributors"]
description = "Comprehensive performance benchmarks for Moirai concurrency library"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/Moirai"

[dependencies]
moirai = { package = "moirai-runtime", path = "../moirai", version = "0.5.0", default-features = false, features = ["distributed"] }
moirai-core = { path = "../moirai-core", version = "0.5.0" }
moirai-executor = { path = "../moirai-executor", version = "0.5.0" }
moirai-scheduler = { path = "../moirai-scheduler", version = "0.5.0" }
moirai-sync = { path = "../moirai-sync", version = "0.5.0" }
moirai-transport = { path = "../moirai-transport", version = "0.5.0", features = ["scheduler-routes"] }
moirai-utils = { path = "../moirai-utils", version = "0.5.0" }
moirai-iter = { path = "../moirai-iter", version = "0.5.0" }
moirai-async = { path = "../moirai-async", version = "0.5.0", features = ["tokio-compat"] }
moirai-metrics = { path = "../moirai-metrics", version = "0.5.0" }
mnemosyne = { workspace = true }

# Benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

# Comparison libraries
tokio = { version = "1.0", features = ["full"] }
rayon = "1.8"
crossbeam = "0.8"
num_cpus = "1.16"
futures = "0.3"

# Additional dependencies for benchmarks
socket2 = "0.5"
libc = "0.2"

[dev-dependencies]
rand = "0.8"
serde_json = "1.0"

[[bench]]
name = "industry_comparison"
harness = false

[[bench]]
name = "collective_ops_comparison"
harness = false

[[bench]]
name = "simd_benchmarks"
harness = false

[[bench]]
name = "iter_simd_comparison"
harness = false

[[bench]]
name = "thread_schedule_comparison"
harness = false

[[bench]]
name = "performance_benchmarks"
harness = false

[[bench]]
name = "moirai_benchmarks"
harness = false

[[bench]]
name = "public_result_handle_comparison"
harness = false

[[bench]]
name = "example_pattern_comparison"
harness = false

[[bench]]
name = "channel_matrix"
harness = false

[[bench]]
name = "transport_archive_comparison"
harness = false

[[bench]]
name = "result_handle_diagnostics"
harness = false
required-features = ["registry-diagnostics"]

[[bench]]
name = "iterator_adapter_comparison"
harness = false

[[bench]]
name = "parallel_iterator_regression"
harness = false

[[bench]]
name = "process_server_scheduler_routing"
harness = false

[[bench]]
name = "process_server_routed_execution"
harness = false

[[bench]]
name = "iter_ops_parallel_comparison"
harness = false

[[bench]]
name = "cache_iterator_comparison"
harness = false

[[bench]]
name = "execution_context_comparison"
harness = false

[[bench]]
name = "async_iterator_comparison"
harness = false

[[bench]]
name = "sorting_comparison"
harness = false

[[bench]]
name = "async_fs_comparison"
harness = false

[[bench]]
name = "async_fs_dir_comparison"
harness = false

[[bench]]
name = "async_udp_comparison"
harness = false

[[bench]]
name = "async_tcp_comparison"
harness = false

[[bench]]
name = "async_tcp_backpressure_comparison"
harness = false

[[bench]]
name = "async_tcp_readiness_comparison"
harness = false

[[bench]]
name = "async_tcp_cancel_safety_comparison"
harness = false

[[bench]]
name = "async_io_compat_comparison"
harness = false

[[bench]]
name = "metrics_collector_comparison"
harness = false

[features]
default = ["async", "iter", "parallel", "local", "mnemosyne-memory"]
async = ["moirai/async"]
iter = ["moirai/iter"]
parallel = ["moirai/parallel"]
local = ["moirai/local"]
mnemosyne = ["moirai/mnemosyne"]
mnemosyne-memory = ["mnemosyne"]
full = ["moirai/full", "tokio/full"]
registry-diagnostics = ["moirai-executor/registry-diagnostics"]
scheduler-diagnostics = ["moirai-executor/scheduler-diagnostics"]
result-diagnostics = ["moirai-core/result-diagnostics"]

[[bench]]
name = "spsc_throughput"
harness = false

[lints]
workspace = true
