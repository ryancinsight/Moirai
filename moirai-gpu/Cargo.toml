[package]
name = "moirai-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/moirai-gpu"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "GPU launch planning and optional wgpu compute integration for the Moirai concurrency library"

[dependencies]
themis = { workspace = true }
mnemosyne-core = { workspace = true }
moirai-core = { workspace = true }
moirai-executor = { workspace = true, optional = true }
moirai-utils = { workspace = true, features = ["std"] }

# GPU compute dependencies
wgpu = { version = "0.19", optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }

# Async runtime support
futures = { version = "0.3", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[features]
default = ["std", "parallel", "mnemosyne-memory", "wgpu-backend"]
std = []
parallel = []
mnemosyne-memory = []
wgpu-backend = ["dep:bytemuck", "dep:futures", "dep:moirai-executor", "dep:wgpu"]
serde = ["dep:serde"]

[[bench]]
name = "gpu_compute"
harness = false
