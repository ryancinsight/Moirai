[package]
name = "moirai-tls"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/moirai-tls"
rust-version.workspace = true
description = "Async TLS client for the Moirai runtime: rustls driven over Moirai async sockets, no Tokio"
keywords = ["tls", "rustls", "async", "moirai", "network"]
categories = ["network-programming", "cryptography"]

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = []
mnemosyne-memory = []

[dependencies]
moirai-async = { workspace = true }
moirai-crypto = { workspace = true }
futures-io = { workspace = true }
futures-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
moirai = { package = "moirai-runtime", path = "../moirai", default-features = false, features = ["async"] }
rustls-pemfile = { workspace = true }
