[package]
name = "moirai-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Synchronization primitives for Moirai concurrency library"

[dependencies]
moirai-core = { workspace = true }
moirai-utils = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
# Asserts the auto-trait bounds of `FutexMutexGuard`, including the negative one
# that a positive assertion cannot express.
static_assertions = "1.1"

[[bench]]
name = "resource_pool"
harness = false

[features]
default = []
metrics = ["moirai-core/metrics"]
