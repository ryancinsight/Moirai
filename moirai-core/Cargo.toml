[package]
name = "moirai-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Core abstractions and traits for the Moirai concurrency library"

[dependencies]
moirai-utils = { workspace = true, features = ["std"] }
mnemosyne = { workspace = true, optional = true }
themis = { workspace = true, optional = true }
# Pod bound for shared-memory IPC payloads (any-bit-pattern validity across the
# process trust boundary). no_std-compatible; only reached by the std+OS-gated
# `ipc` module.
bytemuck = { workspace = true }

# Unix dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Asserts that the SPSC halves stay !Sync, which a positive assertion cannot express.
static_assertions = "1.1"
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = ["std", "parallel", "mnemosyne-memory"]
no-std = []
std = ["dep:themis"]
parallel = []
numa = []
metrics = []
coroutine = ["std"]
result-diagnostics = ["std"]
mnemosyne = ["dep:mnemosyne"]
mnemosyne-memory = ["mnemosyne"]
