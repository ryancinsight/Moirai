[package]
name = "moirai-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/moirai-core"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Core abstractions and traits for the Moirai concurrency library"

[dependencies]
moirai-utils = { workspace = true, features = ["std"] }
mnemosyne = { workspace = true, optional = true }
themis = { workspace = true, optional = true }
# Pod bound for shared-memory IPC payloads (any-bit-pattern validity across the
# process trust boundary). no_std-compatible; only reached by the std+OS-gated
# `ipc` module.
bytemuck = { workspace = true }

# Unix dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Asserts that the SPSC halves stay !Sync, which a positive assertion cannot express.
static_assertions = "1.1"
criterion = { workspace = true }
proptest = { workspace = true }

# loom model checker — only compiled under `--cfg loom` (see the channel models
# in `tests/loom_mpmc_waiter.rs` and `tests/loom_spsc_ring.rs`).
[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

[features]
default = ["std", "parallel", "mnemosyne-memory"]
no-std = []
std = ["dep:themis"]
parallel = []
metrics = []
coroutine = ["std"]
result-diagnostics = ["std"]
mnemosyne = ["dep:mnemosyne"]
mnemosyne-memory = ["mnemosyne"]

# Register the `loom` cfg so the -D warnings gate stays clean (it is set via
# `RUSTFLAGS="--cfg loom"`, not a Cargo feature).
[lints]
workspace = true
