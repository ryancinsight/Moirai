[workspace]
members = [
    "moirai-core",
    "moirai-executor",
    "moirai-scheduler", 
    "moirai-transport",
    "moirai-sync",
    "moirai-async",
    "moirai-pal",
    "moirai-iter",
    "moirai-parallel",
    "moirai-tls",
    "moirai-http",
    "moirai-metrics",
    "moirai-utils",
    "moirai-gpu",
    "moirai-python",
    "moirai",
    "benchmarks",
    "tests"
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Moirai Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/moirai-rs/moirai"
homepage = "https://moirai-rs.github.io"
documentation = "https://docs.rs/moirai"
keywords = ["concurrency", "async", "parallel", "zero-cost", "performance"]
categories = ["concurrency", "asynchronous"]
rust-version = "1.75.0"

[workspace.dependencies]
# Internal dependencies
moirai-core = { path = "moirai-core", version = "0.2.0" }
moirai-executor = { path = "moirai-executor", version = "0.2.0" }
moirai-scheduler = { path = "moirai-scheduler", version = "0.2.0" }
moirai-transport = { path = "moirai-transport", version = "0.2.0" }
moirai-sync = { path = "moirai-sync", version = "0.2.0" }
moirai-async = { path = "moirai-async", version = "0.2.0" }
moirai-pal = { path = "moirai-pal", version = "0.2.0" }
moirai-iter = { path = "moirai-iter", version = "0.2.0" }
moirai-parallel = { path = "moirai-parallel", version = "0.2.0" }
moirai-tls = { path = "moirai-tls", version = "0.2.0" }
moirai-http = { path = "moirai-http", version = "0.2.0" }
moirai-metrics = { path = "moirai-metrics", version = "0.2.0" }
moirai-utils = { path = "moirai-utils", version = "0.2.0", features = ["std"] }
moirai-gpu = { path = "moirai-gpu", version = "0.2.0" }
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.9.0", default-features = false }
themis = { git = "https://github.com/ryancinsight/themis", version = "0.9", default-features = false, features = ["std"] }
# Kernel resource budget vocabulary for the GPU occupancy planner (atlas ADR 0002).
mnemosyne-core = { git = "https://github.com/ryancinsight/Mnemosyne.git", version = "0.1.0", package = "mnemosyne-core", default-features = false }
mnemosyne = { git = "https://github.com/ryancinsight/Mnemosyne.git", version = "0.2.0", default-features = false }

# Network stack (ADR-015): sans-I/O, runtime-agnostic, NOT tokio-coupled.
# `ring` crypto provider (no aws-lc-rs NASM/cmake toolchain requirement on Windows).
futures-io = "0.3"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
http = "1"
httparse = "1"

# Plain-old-data marker traits (zero-cost bit-pattern validity for shared-memory
# IPC and GPU buffers). SSOT version for every workspace member.
bytemuck = "1.14"

# Development and testing dependencies only (not used in runtime)
criterion = "0.5"
rcgen = "0.13"
fastrand = "2.0"
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
pyo3 = "0.22"
# Exhaustive-interleaving model checker for lock-free code (gated behind
# `--cfg loom`; not built in normal/CI test runs).
loom = "0.7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 1
debug = true
