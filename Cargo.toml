[workspace]
members = [
    "moirai-core",
    "moirai-executor",
    "moirai-scheduler", 
    "moirai-transport",
    "moirai-sync",
    "moirai-async",
    "moirai-async-macros",
    "moirai-pal",
    "moirai-iter",
    "moirai-parallel",
    "moirai-crypto",
    "moirai-tls",
    "moirai-http",
    "moirai-metrics",
    "moirai-utils",
    "moirai-gpu",
    "moirai-python",
    "moirai",
    "benchmarks",
    "tests"
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Moirai Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/Moirai"
readme = "README.md"
homepage = "https://github.com/ryancinsight/Moirai"
keywords = ["concurrency", "async", "parallel", "zero-cost", "performance"]
categories = ["concurrency", "asynchronous"]
rust-version = "1.95"

[workspace.dependencies]
# Internal dependencies
moirai-core = { path = "moirai-core", version = "0.5.0" }
moirai-executor = { path = "moirai-executor", version = "0.5.0" }
moirai-scheduler = { path = "moirai-scheduler", version = "0.5.0" }
moirai-transport = { path = "moirai-transport", version = "0.5.0" }
moirai-sync = { path = "moirai-sync", version = "0.5.0" }
moirai-async = { path = "moirai-async", version = "0.5.0" }
moirai-async-macros = { path = "moirai-async-macros", version = "0.5.0" }
moirai-pal = { path = "moirai-pal", version = "0.5.0" }
moirai-iter = { path = "moirai-iter", version = "0.5.0" }
moirai-parallel = { path = "moirai-parallel", version = "0.5.0" }
moirai-tls = { path = "moirai-tls", version = "0.5.0" }
moirai-crypto = { path = "moirai-crypto", version = "0.5.0" }
moirai-http = { path = "moirai-http", version = "0.5.0" }
moirai-metrics = { path = "moirai-metrics", version = "0.5.0" }
moirai-utils = { path = "moirai-utils", version = "0.5.0", features = ["std"] }
moirai-gpu = { path = "moirai-gpu", version = "0.5.0" }
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.9.0", default-features = false }
themis = { package = "themis-topology", git = "https://github.com/ryancinsight/themis", version = "0.10.1", default-features = false, features = ["std"] }
# Kernel resource budget vocabulary for the GPU occupancy planner (atlas ADR 0002).
mnemosyne-core = { git = "https://github.com/ryancinsight/Mnemosyne.git", version = "0.2.0", package = "mnemosyne-memory-core", default-features = false }
mnemosyne = { git = "https://github.com/ryancinsight/Mnemosyne.git", version = "0.7.0", package = "mnemosyne-memory", default-features = false }

# Network stack (ADR-015): sans-I/O, runtime-agnostic, NOT tokio-coupled.
# Pure-Rust crypto via moirai-crypto (RustCrypto backend) — no ring, no aws-lc-rs,
# no C toolchain required.  Replaces the previous `features = ["ring", ...]`.
futures-io = "0.3"
futures-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
http = "1"
httparse = "1"

# Plain-old-data marker traits (zero-cost bit-pattern validity for shared-memory
# IPC and GPU buffers). SSOT version for every workspace member.
bytemuck = "1.14"

# Development and testing dependencies only (not used in runtime)
criterion = "0.5"
rustls-pemfile = "2"
fastrand = "2.0"
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
pyo3 = "0.29.2"
# Exhaustive-interleaving model checker for lock-free code (gated behind
# `--cfg loom`; not built in normal/CI test runs).
loom = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
opt-level = 1
debug = "line-tables-only"

[workspace.lints.rust]
# `loom` is a cfg set only by the model runs (`RUSTFLAGS="--cfg loom"`), never by
# cargo, so declare it or every build warns about an unexpected condition name.
# Declared workspace-wide because a member cannot carry its own `[lints.rust]`
# table alongside `lints.workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed
# is a hard error. Counts are `cargo clippy --all-targets` hits at the time
# the floor was established (total / production, production excluding
# `#[cfg(test)]` modules and test, bench and example targets). Burn a class
# down to zero, then delete its line -- the floor tightens, never loosens.

# --- Documentation debt (531 sites, 503 in production) ---
must_use_candidate = "allow" # 208 (208 prod)
missing_errors_doc = "allow" # 145 (145 prod)
missing_panics_doc = "allow" # 89 (89 prod)
doc_markdown = "allow" # 69 (44 prod)
return_self_not_must_use = "allow" # 15 (15 prod)
ignore_without_reason = "allow" # 3 (0 prod)
missing_fields_in_debug = "allow" # 2 (2 prod)

# --- Numeric conversion debt (392 sites, 52 in production) ---
cast_precision_loss = "allow" # 175 (13 prod)
cast_possible_truncation = "allow" # 106 (18 prod)
cast_sign_loss = "allow" # 37 (6 prod)
cast_lossless = "allow" # 32 (3 prod)
cast_possible_wrap = "allow" # 22 (6 prod)
unreadable_literal = "allow" # 11 (0 prod)
float_cmp = "allow" # 3 (3 prod)
comparison_chain = "allow" # 2 (2 prod)
stable_sort_primitive = "allow" # 2 (0 prod)
manual_midpoint = "allow" # 1 (1 prod)
range_plus_one = "allow" # 1 (0 prod)

# --- Raw-pointer / layout debt (46 sites, 41 in production) ---
ptr_as_ptr = "allow" # 26 (26 prod)
borrow_as_ptr = "allow" # 11 (7 prod)
ptr_cast_constness = "allow" # 5 (5 prod)
ref_as_ptr = "allow" # 3 (2 prod)
large_stack_arrays = "allow" # 1 (1 prod)

# --- Time / duration debt (8 sites, 3 in production) ---
# `unchecked_time_subtraction` is NOT listed: its 5 sites were converted to
# `checked_sub` (one production panic path in the executor registry).
duration_suboptimal_units = "allow" # 8 (3 prod)

# --- Style debt (692 sites, 171 in production) ---
uninlined_format_args = "allow" # 184 (3 prod)
semicolon_if_nothing_returned = "allow" # 142 (4 prod)
redundant_closure_for_method_calls = "allow" # 58 (35 prod)
elidable_lifetime_names = "allow" # 55 (55 prod)
unnecessary_wraps = "allow" # 33 (1 prod)
too_many_lines = "allow" # 24 (0 prod)
map_unwrap_or = "allow" # 19 (5 prod)
single_match_else = "allow" # 16 (7 prod)
match_same_arms = "allow" # 15 (4 prod)
needless_pass_by_value = "allow" # 13 (6 prod)
explicit_iter_loop = "allow" # 12 (2 prod)
unused_async = "allow" # 12 (10 prod)
items_after_statements = "allow" # 11 (1 prod)
similar_names = "allow" # 11 (1 prod)
unused_self = "allow" # 11 (0 prod)
inline_always = "allow" # 10 (10 prod)
manual_assert = "allow" # 10 (1 prod)
manual_let_else = "allow" # 7 (2 prod)
wildcard_imports = "allow" # 6 (4 prod)
if_not_else = "allow" # 5 (4 prod)
needless_continue = "allow" # 5 (2 prod)
ignored_unit_patterns = "allow" # 4 (1 prod)
struct_excessive_bools = "allow" # 4 (3 prod)
assigning_clones = "allow" # 3 (3 prod)
match_wildcard_for_single_variants = "allow" # 3 (3 prod)
used_underscore_binding = "allow" # 3 (1 prod)
bool_to_int_with_if = "allow" # 2 (0 prod)
many_single_char_names = "allow" # 2 (1 prod)
struct_field_names = "allow" # 2 (0 prod)
cloned_instead_of_copied = "allow" # 1 (0 prod)
fn_params_excessive_bools = "allow" # 1 (1 prod)
linkedlist = "allow" # 1 (0 prod)
manual_string_new = "allow" # 1 (0 prod)
needless_for_each = "allow" # 1 (0 prod)
needless_raw_string_hashes = "allow" # 1 (0 prod)
no_effect_underscore_binding = "allow" # 1 (0 prod)
option_option = "allow" # 1 (1 prod)
single_char_pattern = "allow" # 1 (0 prod)
trivially_copy_pass_by_ref = "allow" # 1 (0 prod)

# --- Restriction floor ---
# `unwrap_used` is denied outright: no workspace-wide allow. The 802 existing
# sites (131 in production) are pinned per file by `#![expect(..., reason = "MOIRAI-UNWRAP-1")]`,
# which self-expires the moment a file's last unwrap goes.
unwrap_used = "deny"
