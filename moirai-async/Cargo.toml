[package]
name = "moirai-async"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/moirai-async"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Async/await support for Moirai concurrency library"

[dependencies]
moirai-core = { workspace = true }
moirai-executor = { workspace = true }
moirai-transport = { workspace = true }
moirai-utils = { workspace = true }
moirai-pal = { workspace = true }
moirai-async-macros = { workspace = true }
futures = "0.3"
socket2 = "0.5"
tokio_dep = { package = "tokio", version = "1.0", features = ["io-util"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = "3.0"

# loom model checker — only compiled under `--cfg loom` (see the protocol models
# in tests/loom_result_slot.rs, tests/loom_wake_dedup.rs, and
# tests/loom_connection_pool.rs).
[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = []
mnemosyne-memory = []
io = []
timers = []
metrics = ["moirai-core/metrics"]
tokio-compat = ["dep:tokio_dep"]

# Register the `loom` cfg so the -D warnings gate stays clean (it is set via
# `RUSTFLAGS="--cfg loom"`, not a Cargo feature).
[lints]
workspace = true
