# Licensed Quinn 0.11.12 adaptation; maintained native package manifest.
# Original metadata and per-file provenance are preserved under provenance/
# and UPSTREAM_SOURCE.json. Cargo generates this package's own VCS receipt.

[package]
edition = "2021"
rust-version = "1.95"
name = "moirai-quinn"
version = "0.1.0"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Licensed Quinn 0.11.12 adaptation using Moirai native synchronization and I/O"
readme = "README.md"
keywords = ["quic"]
categories = [
    "network-programming",
    "asynchronous",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/Moirai"

[package.metadata.docs.rs]
features = [
    "lock_tracking",
    "rustls-aws-lc-rs",
    "rustls-ring",
    "runtime-tokio",
    "runtime-async-std",
    "runtime-smol",
    "log",
    "rustls-log",
]

[features]
__rustls-post-quantum-test = [
    "rustls/prefer-post-quantum",
    "rustls-aws-lc-rs",
    "proto/__rustls-post-quantum-test",
]
aws-lc-rs = ["proto/aws-lc-rs"]
aws-lc-rs-fips = ["proto/aws-lc-rs-fips"]
bloom = ["proto/bloom"]
default = [
    "log",
    "platform-verifier",
    "rustls-ring",
    "bloom",
]
lock_tracking = []
log = [
    "tracing/log",
    "proto/log",
    "udp/log",
]
platform-verifier = ["proto/platform-verifier"]
qlog = ["proto/qlog"]
ring = ["proto/ring"]
runtime-async-std = [
    "async-io",
    "async-global-executor",
]
runtime-smol = [
    "async-io",
    "smol",
]
tokio-compat = ["dep:tokio", "tokio/io-util"]
runtime-tokio = [
    "tokio-compat",
    "tokio/time",
    "tokio/rt",
    "tokio/net",
]
rustls = ["rustls-ring"]
rustls-aws-lc-rs = [
    "dep:rustls",
    "aws-lc-rs",
    "proto/rustls-aws-lc-rs",
    "proto/aws-lc-rs",
]
rustls-aws-lc-rs-fips = [
    "dep:rustls",
    "aws-lc-rs-fips",
    "proto/rustls-aws-lc-rs-fips",
    "proto/aws-lc-rs-fips",
]
rustls-log = ["rustls?/logging"]
rustls-ring = [
    "dep:rustls",
    "ring",
    "proto/rustls-ring",
    "proto/ring",
]

[lib]
name = "moirai_quinn"
path = "src/lib.rs"

[[example]]
name = "client"
path = "examples/client.rs"
required-features = ["rustls-ring", "runtime-tokio"]

[[example]]
name = "connection"
path = "examples/connection.rs"
required-features = ["rustls-ring", "runtime-tokio"]

[[example]]
name = "insecure_connection"
path = "examples/insecure_connection.rs"
required-features = ["rustls-ring", "runtime-tokio"]

[[example]]
name = "server"
path = "examples/server.rs"
required-features = ["rustls-ring", "runtime-tokio"]

[[example]]
name = "single_socket"
path = "examples/single_socket.rs"
required-features = ["rustls-ring", "runtime-tokio"]

[[test]]
name = "many_connections"
path = "tests/many_connections.rs"
required-features = ["runtime-tokio", "rustls-ring"]

[[test]]
name = "async_std_runtime"
path = "tests/async_std_runtime.rs"
required-features = ["runtime-async-std", "rustls-ring"]

[[test]]
name = "async_std_runtime_config"
path = "tests/async_std_runtime_config.rs"
required-features = ["runtime-async-std"]

[[test]]
name = "post_quantum"
path = "tests/post_quantum.rs"
required-features = ["__rustls-post-quantum-test", "runtime-tokio"]

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false
required-features = ["rustls-ring", "runtime-tokio"]

[dependencies.async-io]
version = "2"
optional = true

[dependencies.async-global-executor]
version = "2.4.1"
optional = true

[dependencies.moirai-async]
path = "../moirai-async"
version = "0.12.0"
default-features = false

[dependencies.bytes]
version = "1"

[dependencies.futures-io]
version = "0.3.19"
optional = true

[dependencies.pin-project-lite]
version = "0.2"

[dependencies.proto]
version = "0.11.19"
default-features = false
package = "quinn-proto"

[dependencies.rustc-hash]
version = "2"

[dependencies.rustls]
version = "0.23.46"
features = ["std"]
optional = true
default-features = false

[dependencies.smol]
version = "2"
optional = true

[dependencies.thiserror]
version = "2.0.3"

[dependencies.tokio]
version = "1.54.1"
optional = true
features = ["io-util"]

[dependencies.tracing]
version = "0.1.10"
features = ["std"]
default-features = false

[dependencies.udp]
version = "0.5.16"
features = ["tracing"]
default-features = false
package = "quinn-udp"

[dev-dependencies.anyhow]
version = "1.0.22"

[dev-dependencies.bencher]
version = "0.1.5"

[dev-dependencies.clap]
version = "4"
features = ["derive"]

[dev-dependencies.crc]
version = "3"

[dev-dependencies.directories-next]
version = "2"

[dev-dependencies.futures-lite]
version = "2"

[dev-dependencies.rand]
version = "0.10.1"

[dev-dependencies.rcgen]
version = "0.14"

[dev-dependencies.tokio]
version = "1.54.1"
features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "net",
    "io-util",
]

[dev-dependencies.tracing-futures]
version = "0.2.0"
features = ["std-future"]
default-features = false

[dev-dependencies.tracing-subscriber]
version = "0.3.0"
features = [
    "env-filter",
    "fmt",
    "ansi",
    "time",
    "local-time",
]
default-features = false

[dev-dependencies.url]
version = "2"

[build-dependencies.cfg_aliases]
version = "0.2"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.web-time]
version = "1"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies.socket2]
version = ">=0.5, <0.7"
