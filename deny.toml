[graph]
all-features = true

[advisories]
yanked = "deny"
unused-ignored-advisory = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally omit registry versions; the
# published dependency edges are versioned in each package manifest.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ryancinsight/melinoe.git",
    "https://github.com/ryancinsight/Mnemosyne.git",
    "https://github.com/ryancinsight/themis",
]
