[graph]
all-features = true

[advisories]
yanked = "deny"
unused-ignored-advisory = "deny"
# The RSA advisory has no safe upstream release that removes the finding and
# remains a tracked residual in CHECKLIST.md and GAP_ANALYSIS.md.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "RSA support remains required by moirai-crypto; replacement design is tracked in CHECKLIST.md because no safe upstream release is available." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally omit registry versions; the
# published dependency edges are versioned in each package manifest.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ryancinsight/hephaestus",
    "https://github.com/ryancinsight/Moirai.git",
]
